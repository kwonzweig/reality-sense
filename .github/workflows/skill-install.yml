name: Skill installation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and compare the skill files
        env:
          DO_NOT_TRACK: '1'
        run: |
          cd "$(mktemp -d)"
          npx --yes skills@1.7.1 add "$GITHUB_WORKSPACE" --skill reality-sense --agent codex --copy -y
          diff -r "$GITHUB_WORKSPACE/skills/reality-sense" .agents/skills/reality-sense
